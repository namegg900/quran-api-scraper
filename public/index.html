<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quran Reader - Tema Islami</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="hero">
      <div>
        <p class="badge">Quran Reader • Profesional</p>
        <h1>الْقُرْآنُ الْكَرِيمُ</h1>
        <p class="subtitle">Tampilan membaca Al-Qur'an seperti membuka halaman, nyaman di mobile, tablet, dan desktop.</p>
      </div>
      <div class="meta">
        <p id="todayDate"></p>
        <p>Creator: <strong>name</strong></p>
      </div>
    </header>

    <main>
      <section class="card controls-grid">
        <div>
          <label for="chapterSelect">Pilih Surah</label>
          <select id="chapterSelect"></select>
        </div>
        <div>
          <label for="ayahPerPage">Ayat per Halaman</label>
          <select id="ayahPerPage">
            <option value="5">5</option>
            <option value="8" selected>8</option>
            <option value="10">10</option>
            <option value="15">15</option>
          </select>
        </div>
      </section>

      <section class="card" id="chapterInfo"></section>

      <section class="page-wrap">
        <div class="page-toolbar">
          <button id="prevPage">⟵ Halaman Sebelumnya</button>
          <p id="pageIndicator">Halaman 1 / 1</p>
          <button id="nextPage">Halaman Berikutnya ⟶</button>
        </div>
        <section class="verses" id="versesContainer"></section>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
